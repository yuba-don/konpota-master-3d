name: GDScript Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-gdscript:
    name: Check GDScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GODOT_VERSION: 4.7.2
      GODOT_RELEASE: stable
      GDTOOLKIT_VERSION: 4.5.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: python -m pip install "gdtoolkit==${GDTOOLKIT_VERSION}"

      - name: Lint GDScript
        shell: bash
        run: |
          set -euo pipefail

          scripts=()
          while IFS= read -r -d '' script; do
            scripts+=("${script}")
          done < <(
            find . \
              -path './.git' -prune -o \
              -path './.godot' -prune -o \
              -path './addons' -prune -o \
              -type f -name '*.gd' -print0
          )

          if (( ${#scripts[@]} == 0 )); then
            echo 'No GDScript files to lint.'
          else
            gdlint "${scripts[@]}"
          fi

      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          release: ${{ env.GODOT_RELEASE }}

      - name: Build Godot class cache
        run: godot --headless --path . --import --quit

      - name: Verify images and Japanese font
        run: godot --headless --path . --script tests/web_assets_smoke.gd

      - name: Check GDScript syntax
        shell: bash
        run: |
          set -uo pipefail

          found=0
          status=0

          while IFS= read -r -d '' script; do
            found=1
            echo "::group::${script}"
            godot --headless --path . --check-only --script "${script}" || status=1
            echo '::endgroup::'
          done < <(
            find . \
              -path './.git' -prune -o \
              -path './.godot' -prune -o \
              -path './addons' -prune -o \
              -type f -name '*.gd' -print0
          )

          if (( found == 0 )); then
            echo 'No GDScript files found.'
            exit 0
          fi

          exit "${status}"
