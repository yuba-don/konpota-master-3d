name: Deploy WebGL to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: stable
  EXPORT_PRESET: Web
  EXPORT_DIR: build/web

jobs:
  build:
    name: Export WebGL build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify LFS assets
        shell: bash
        run: |
          set -euo pipefail
          git lfs fsck --objects
          if grep -rlI '^version https://git-lfs.github.com/spec/v1$' assets icon.svg; then
            echo '::error::Unresolved Git LFS pointers found'
            exit 1
          fi

      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          release: ${{ env.GODOT_RELEASE }}
          export-templates: "true"

      - name: Import assets
        run: godot --headless --path . --import --quit

      - name: Verify images and Japanese font
        run: godot --headless --path . --script tests/web_assets_smoke.gd

      - name: Export WebGL build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EXPORT_DIR}"
          godot --headless --path . --export-release "${EXPORT_PRESET}" "${EXPORT_DIR}/index.html"

          for ext in html js wasm pck; do
            if [[ ! -s "${EXPORT_DIR}/index.${ext}" ]]; then
              echo "::error::Missing export output: index.${ext}"
              exit 1
            fi
          done
          ls -lh "${EXPORT_DIR}"

      - name: Verify exported asset pack
        run: |
          godot --headless --path "${RUNNER_TEMP}" \
            --main-pack "${GITHUB_WORKSPACE}/${EXPORT_DIR}/index.pck" \
            --script res://tests/web_assets_smoke.gd

      - name: Upload build for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ${{ env.EXPORT_DIR }}
          retention-days: 7

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.EXPORT_DIR }}

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
